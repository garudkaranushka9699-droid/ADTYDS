name: Daily 8 AM Cron Job

on:
  schedule:
    - cron: '0 8 * * *'

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print start message
        run: echo "Daily job has started!"

      - name: Display current date and time
        run: date

      - name: Print completion message
        run: echo "Daily job has completed successfully!"
