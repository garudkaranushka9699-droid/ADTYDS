name: 5 Minute Cron Job


on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-scheduled-tasks:
  
    runs-on: ubuntu-latest

    steps:
      
      - name: Print Start Message
        run: echo "Starting the scheduled 5-minute task..."

      
      - name: Show Date and Time
        run: date

      
      - name: Print Completion Message
        run: echo "Task completed successfully!"
